apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-triage-hpa
  namespace: incident-triage-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-triage-api
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70